# Serves the SPA and proxies the API to the backend service (same origin: no CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # MapLibre ships its worker as an ES module (.mjs), unknown to the default mime.types
    location ~ \.mjs$ {
      default_type application/javascript;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  location /basemap/ {
    expires 7d;
  }

  location / {
    try_files $uri /index.html;
  }
}
